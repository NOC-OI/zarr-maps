name: Publish to npm

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.2.3 etc.

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build zarr-maps-colormap
        run: npm run build:colormap

      - name: Stage zarr-maps-colormap
        run: npm stage publish --workspace=zarr-maps-colormap --access public

      - name: Build zarr-maps-tiling
        run: npm run build:tiling

      - name: Stage zarr-maps-tiling
        run: npm stage publish --workspace=zarr-maps-tiling --access public

      - name: Build zarr-maps-explorer
        run: npm run build:explorer

      - name: Stage zarr-maps-explorer
        run: npm stage publish --workspace=zarr-maps-explorer --access public

      - name: Build zarr-maps-leaflet
        run: npm run build:leaflet

      - name: Stage zarr-maps-leaflet
        run: npm stage publish --workspace=zarr-maps-leaflet --access public

      - name: Build zarr-maps-ol
        run: npm run build:ol

      - name: Stage zarr-maps-ol
        run: npm stage publish --workspace=zarr-maps-ol --access public
