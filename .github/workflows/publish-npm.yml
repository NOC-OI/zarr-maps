          echo "Checking $NAME@$VERSION"

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already exists on npm. Skipping."
          else
            echo "Staging $NAME@$VERSION"
            npm stage publish --workspace="$WORKSPACE" --access public
          fi

      # ------------------------------------------------------------
      # zarr-maps-explorer
      # ------------------------------------------------------------

      - name: Build zarr-maps-explorer
        run: npm run build:explorer

      - name: Stage zarr-maps-explorer
        run: |
          WORKSPACE="zarr-maps-explorer"

          NAME=$(npm pkg get name --workspace="$WORKSPACE" | jq -r 'to_entries[0].value')
          VERSION=$(npm pkg get version --workspace="$WORKSPACE" | jq -r 'to_entries[0].value')

          echo "Checking $NAME@$VERSION"

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already exists on npm. Skipping."
          else
            echo "Staging $NAME@$VERSION"
            npm stage publish --workspace="$WORKSPACE" --access public
          fi

      # ------------------------------------------------------------
      # zarr-maps-leaflet
      # ------------------------------------------------------------

      - name: Build zarr-maps-leaflet
        run: npm run build:leaflet

      - name: Stage zarr-maps-leaflet
        run: |
          WORKSPACE="zarr-maps-leaflet"

          NAME=$(npm pkg get name --workspace="$WORKSPACE" | jq -r 'to_entries[0].value')
