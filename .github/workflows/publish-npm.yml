name: Publish to npm

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.2.3 etc.

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci --include=dev

      # ------------------------------------------------------------
      # zarr-maps-colormap
      # ------------------------------------------------------------

      - name: Build zarr-maps-colormap
        run: npm run build:colormap

      - name: Stage zarr-maps-colormap
        run: |
          WORKSPACE="zarr-maps-colormap"

          NAME=$(npm pkg get name --workspace="$WORKSPACE" | jq -r 'to_entries[0].value')
          VERSION=$(npm pkg get version --workspace="$WORKSPACE" | jq -r 'to_entries[0].value')

          echo "Checking $NAME@$VERSION"

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already exists on npm. Skipping."
          else
            echo "Staging $NAME@$VERSION"
            npm stage publish --workspace="$WORKSPACE" --access public
          fi

      # ------------------------------------------------------------
      # zarr-maps-tiling
      # ------------------------------------------------------------

      - name: Build zarr-maps-tiling
        run: npm run build:tiling

      - name: Stage zarr-maps-tiling
        run: |
